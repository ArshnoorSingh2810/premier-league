[build]
  command = "npm --prefix frontend/premier-league-analytics install && npm --prefix frontend/premier-league-analytics run build"
  publish = "frontend/premier-league-analytics/dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
